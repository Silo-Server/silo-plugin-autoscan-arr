name: Release

# A release is a merged pull request that sets manifest.json "version", then a
# maintainer pushes the matching v<version> tag on main. The shared workflow
# refuses tags that are not v<semver>, not on main, or that disagree with
# manifest.json. See CONTRIBUTING.md#release.
on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Always @main, never a SHA: verifiers pin the signer identity to
    # plugin-release.yml@refs/heads/main.
    uses: Silo-Server/.github/.github/workflows/plugin-release.yml@main
    secrets:
      dispatch_token: ${{ secrets.SILO_PLUGINS_DISPATCH_TOKEN }}
